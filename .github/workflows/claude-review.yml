name: Claude review

# Every pull request gets a code review by Claude, and the check fails when the review finds
# a bug the pull request adds. The repository is on GitHub's free plan, which allows no
# branch protection on a private repository, so GitHub cannot refuse the merge: a red
# "Claude review" check is the gate, and merging past it is a decision to say so on the PR.
#
# It runs here only, on a billed runner, so it is Linux only, skips drafts, and a newer push
# cancels the review of the older one. It needs one of two repository secrets:
# ANTHROPIC_API_KEY (a Console key) or CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`). With
# neither, the check fails rather than pass a review that never ran.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # The public repository never starts this: its workflows are published, its
    # pull_request trigger never fires, and the secrets are not there.
    if: github.repository == 'MemorySafe-Labs/memorysafe' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check a credential is set
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$API_KEY" ] && [ -z "$OAUTH_TOKEN" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret; no review ran."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: review
        # A tag can be moved to different code, and this step holds the credential. v1.0.269.
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The base is ${{ github.event.pull_request.base.sha }}; read the change with
            `gh pr diff ${{ github.event.pull_request.number }}` and the surrounding code in the checkout.

            Read CLAUDE.md first, and every file it includes with an @ line: it lists the
            invariants that span files (the tool surface defined in several places, Pydantic
            models dropping undeclared keys, stdout as the JSON-RPC channel, the public and
            private boundary, the version duplicated in several files, code and product claims
            agreeing). Breaking one of those counts as a bug.

            Look for bugs this pull request adds: wrong results, crashes, data loss, security
            and privacy faults (memory text, addresses or secrets reaching a log, a URL or a
            public file), migrations that are not expand-only, broken invariants, and claims in
            docs, legal texts or tool descriptions that no longer match the code. Do not report
            style, naming or taste, and do not report a problem the pull request did not add or
            make worse. Verify each finding against the code before you report it; drop any you
            cannot confirm.

            Read the earlier comments with `gh pr view ${{ github.event.pull_request.number }} --comments`
            and do not repeat a finding already raised there.

            Post each confirmed finding as an inline comment on the line it is about, saying what
            goes wrong and with which input. Then post one summary comment with
            `gh pr comment ${{ github.event.pull_request.number }} --edit-last --body "..."`, and if that
            fails because there is no earlier comment, the same command without --edit-last. Start the
            summary with "Claude review:" and the verdict, then the findings as one line each, or
            "No blocking findings." Never put an attribution line in a comment.

            The verdict is "block" when at least one confirmed finding is a bug this pull request
            adds or makes worse, and "pass" otherwise. Nits never block.
          claude_args: |
            --model sonnet
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","block"]},"blocking":{"type":"integer","minimum":0}},"required":["verdict","blocking"]}'

      - name: Gate on the verdict
        # Read from the environment, not interpolated into the script, and fail closed: no
        # verdict is not a pass.
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          verdict=$(printf '%s' "$RESULT" | jq -r '.verdict // empty' 2>/dev/null || true)
          blocking=$(printf '%s' "$RESULT" | jq -r '.blocking // 0' 2>/dev/null || echo 0)
          case "$verdict" in
            pass) echo "Claude review passed." ;;
            block) echo "::error::Claude review found $blocking blocking finding(s); see the PR comments."; exit 1 ;;
            *) echo "::error::Claude review returned no verdict."; exit 1 ;;
          esac
