name: Private CI

# The one check that cannot run on the public mirror: the hosted edition has a Postgres
# backend, and the code it tests is never published. So it runs here, in the private
# repository, on a billed runner -- which is why it is Linux only, unit tests only, and
# only when something it could break changes. The public suite and the real first start
# run for free on the public mirror (candidate.yml), so nothing here repeats them.
on:
  pull_request:
    paths: ["private/**", "src/**", "tests/**", "pyproject.toml", ".github/workflows/private-ci.yml"]

jobs:
  hosted:
    # The public repository never starts this: its workflows are published, its
    # pull_request trigger never fires, and the code it would test is not there.
    if: github.repository == 'MemorySafe-Labs/memorysafe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MEMORYSAFE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Fail, don't skip, if the database or its driver is missing.
      MEMORYSAFE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e . -e private
      - name: Private tests
        run: uv run --no-sync python -m unittest discover -s private/tests -t .
      - name: Infra tests
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          git diff --quiet ${{ github.event.pull_request.base.sha }} HEAD -- private/infra || {
            uv pip install -r private/infra/requirements.txt && uv run --no-sync python -m unittest private.tests.test_infra
          }
      # The hosted edition has a web app. Node is set up every time (it takes seconds); the
      # install, the build and the browser checks run only when the app, the server it calls,
      # its harness or this workflow changed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web tests
        if: github.event_name == 'pull_request'
        run: |
          git diff --quiet ${{ github.event.pull_request.base.sha }} HEAD -- private/web private/src/memorysafe_hosted private/tests/webapp_e2e_server.py private/tests/pg_support.py .github/workflows/private-ci.yml || {
            cd private/web && npm ci && npm run typecheck && npm test && npm run build && npx playwright install --with-deps chromium && npm run e2e
          }
