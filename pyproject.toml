[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorysafe-chatgpt-connector"
version = "0.4.17"
description = "Private local MCP memory connector for ChatGPT and Codex"
requires-python = ">=3.10"
dependencies = [
  # 49.0.0 is the lowest version that closes every published alert, but it ships macOS wheels for
  # Apple silicon only. An Intel Mac would compile it from source with Rust on first start, which
  # needs Xcode's tools and a network, so Intel macOS gets 48.0.1: the newest with a universal2 wheel.
  "cryptography==49.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "cryptography==48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "mcp==2.0.0",
  "tiktoken==0.14.0",
]

[project.scripts]
memorysafe = "memorysafe_chatgpt.cli:main"
memorysafe-chatgpt = "memorysafe_chatgpt.server:main"
memorysafe-setup = "memorysafe_chatgpt.setup_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
